name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: phoedox, POSTGRES_PASSWORD: phoedox, POSTGRES_DB: phoedox }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U phoedox" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # -p 1: tests of several packages migrate the same Postgres database
      - run: go test -race -p 1 ./...
        env: { PHOEDOX_TEST_PG: "postgres://phoedox:phoedox@localhost:5432/phoedox?sslmode=disable" }
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/phoedox
      - name: Render all variants and validate against the Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          set -e
          for v in "" \
                   "--set database.type=sqlite --set ingress.tls.enabled=false" \
                   "--set database.type=external --set database.external.url=postgres://u:p@db/phoedox --set image.variant=" \
                   "--set clamav.enabled=true --set metrics.enabled=true --set metrics.serviceMonitor=true --set s3.enabled=true --set backups.target=s3 --set mail.enabled=true --set mail.existingSecret=mail --set database.cnpg.backup.enabled=true --set oidc.enabled=true --set oidc.issuer=https://id.example.org --set oidc.clientId=phx --set oidc.existingSecret=oidc"; do
            echo "== helm template $v"
            helm template t deploy/helm/phoedox $v | ./kubeconform -strict -ignore-missing-schemas -summary
          done
