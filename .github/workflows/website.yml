name: website
# Publishes the product website image to ghcr.io/<owner>/phoedox-website
# (tag "main") whenever the website or its server changes (ADR-0054).
on:
  push:
    branches: [main]
    paths: ["website/**", "cmd/phoedox-website/**", "internal/website/**", "internal/publish/**", ".github/workflows/website.yml"]
  workflow_dispatch:
# Builds of the same branch never overlap: a newer push cancels the older
# build, so an older image can never overwrite a newer tag (main, main-full).
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: website/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-website:main
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
