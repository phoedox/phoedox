{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "phoedox.fullname" . }}
  labels:
    {{- include "phoedox.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- if eq .Values.ingress.className "traefik" }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- end }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.domain | quote }}]
      secretName: {{ default (printf "%s-tls" (include "phoedox.fullname" .)) .Values.ingress.tls.secretName }}
    {{- range .Values.publications.domains }}
    - hosts: [{{ . | quote }}]
      secretName: {{ printf "%s-pub-%s" (include "phoedox.fullname" $) (. | replace "." "-") | trunc 63 | trimSuffix "-" }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "phoedox.fullname" . }}
                port: { name: http }
    {{- /* Own domains of publications (ADR-0006): served by the same app, picked by host. */}}
    {{- range .Values.publications.domains }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "phoedox.fullname" $ }}
                port: { name: http }
    {{- end }}
{{- end }}
