{{- if .Values.website.domains }}
# Legal pages of the product website (ADR-0025): Markdown from the values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "phoedox.fullname" . }}-website
  labels:
    {{- include "phoedox.labels" . | nindent 4 }}
data:
  {{- with .Values.website.impressum }}
  impressum.md: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.website.datenschutz }}
  datenschutz.md: |
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
