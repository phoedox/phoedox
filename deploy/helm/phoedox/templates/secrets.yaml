{{- $fn := include "phoedox.fullname" . -}}
{{- if not .Values.masterKey.existingSecret }}
{{- $name := printf "%s-master-key" $fn }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "phoedox.labels" . | nindent 4 }}
  annotations:
    # Generated once; never replaced or deleted by Helm. Back it up.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $old $old.data }}
  master-key: {{ index $old.data "master-key" }}
  {{- else }}
  master-key: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}
{{- if .Values.metrics.enabled }}
---
{{- $name := printf "%s-metrics" $fn }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "phoedox.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $old $old.data }}
  token: {{ index $old.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
