{{- if .Values.clamav.enabled }}
{{- $fn := include "phoedox.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-clamav
  labels:
    {{- include "phoedox.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: clamav
    spec:
      containers:
        - name: clamav
          image: {{ .Values.clamav.image }}
          ports:
            - { name: clamd, containerPort: 3310 }
          # Signatures are downloaded at start; that takes a few minutes.
          startupProbe:
            tcpSocket: { port: clamd }
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: clamd }
            periodSeconds: 30
          resources:
            {{- toYaml .Values.clamav.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-clamav
  labels:
    {{- include "phoedox.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: clamav
  ports:
    - { name: clamd, port: 3310, targetPort: clamd }
{{- end }}
