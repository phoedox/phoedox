{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "phoedox.fullname" . }}
  labels:
    {{- include "phoedox.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      authorization:
        credentials:
          name: {{ include "phoedox.fullname" . }}-metrics
          key: token
{{- end }}
