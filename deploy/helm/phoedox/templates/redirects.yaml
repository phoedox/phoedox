{{- if and .Values.ingress.enabled (eq .Values.ingress.className "traefik") }}
{{- $name := include "phoedox.fullname" . }}
{{- $scheme := ternary "https" "http" .Values.ingress.tls.enabled }}
{{- if and .Values.ingress.tls.enabled .Values.ingress.httpsRedirect }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}-https
  labels:
    {{- include "phoedox.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Plain HTTP for the domain only redirects (ACME challenges of cert-manager
# use their own, more specific route).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-http
  labels:
    {{- include "phoedox.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $name }}-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port: { name: http }
{{- end }}
{{- with .Values.ingress.redirectFrom }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}-to-domain
  labels:
    {{- include "phoedox.labels" $ | nindent 4 }}
spec:
  redirectRegex:
    regex: ^https?://[^/]+/?(.*)
    replacement: {{ printf "%s://%s/${1}" $scheme $.Values.domain | quote }}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-redirect
  labels:
    {{- include "phoedox.labels" $ | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-{{ $name }}-to-domain@kubernetescrd
    {{- if $.Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: traefik
  {{- if $.Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ $name }}-redirect-tls
  {{- end }}
  rules:
    {{- range . }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port: { name: http }
    {{- end }}
{{- end }}
{{- end }}
