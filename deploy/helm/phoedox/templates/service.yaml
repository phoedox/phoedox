apiVersion: v1
kind: Service
metadata:
  name: {{ include "phoedox.fullname" . }}
  labels:
    {{- include "phoedox.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "phoedox.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
    {{- if (.Values.userContent).domain }}
    - name: usercontent
      port: 8443
      targetPort: usercontent
    {{- end }}
