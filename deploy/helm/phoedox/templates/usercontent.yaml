{{- if (.Values.userContent).domain }}
# Apps on the user content domain: Traefik passes TLS through, Phoedox holds
# the wildcard certificate (DNS-01) and serves <app>.<domain> itself.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "phoedox.fullname" . }}-usercontent
  labels:
    {{- include "phoedox.labels" . | nindent 4 }}
spec:
  entryPoints: [websecure]
  routes:
    - match: HostSNIRegexp(`^[a-z0-9-]+\.{{ .Values.userContent.domain | replace "." "\\." }}$`) || HostSNI(`{{ .Values.userContent.domain }}`)
      services:
        - name: {{ include "phoedox.fullname" . }}
          port: 8443
  tls:
    passthrough: true
{{- end }}
