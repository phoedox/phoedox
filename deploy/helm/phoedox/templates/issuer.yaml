{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled .Values.certManager.createIssuer }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.ingress.tls.clusterIssuer }}
  labels:
    {{- include "phoedox.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ required "certManager.email is required for Let's Encrypt" .Values.certManager.email }}
    server: {{ ternary "https://acme-staging-v02.api.letsencrypt.org/directory" "https://acme-v02.api.letsencrypt.org/directory" .Values.certManager.staging }}
    privateKeySecretRef:
      name: {{ .Values.ingress.tls.clusterIssuer }}-account
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingress.className }}
{{- end }}
