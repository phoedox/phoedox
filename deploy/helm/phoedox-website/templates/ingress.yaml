{{- if .Values.ingress.enabled }}
{{- $fn := include "website.fullname" . }}
{{- $domains := required "domains: at least one host, e.g. [phoedox.com]" .Values.domains }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fn }}
  labels: {{- include "website.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- if eq .Values.ingress.className "traefik" }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    {{- range $domains }}
    - hosts: [{{ . | quote }}]
      secretName: {{ printf "%s-%s" $fn (. | replace "." "-") | trunc 63 | trimSuffix "-" }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $domains }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $fn }}, port: { name: http } }
    {{- end }}
{{- if and (eq .Values.ingress.className "traefik") .Values.ingress.tls.enabled .Values.ingress.httpsRedirect }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fn }}-https
  labels: {{- include "website.labels" . | nindent 4 }}
spec:
  redirectScheme: { scheme: https, permanent: true }
---
# Plain HTTP only redirects (cert-manager's ACME challenges use their own route).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fn }}-http
  labels: {{- include "website.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fn }}-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    {{- range $domains }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $fn }}, port: { name: http } }
    {{- end }}
{{- end }}
{{- end }}
