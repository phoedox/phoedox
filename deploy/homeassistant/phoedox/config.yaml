name: Phoedox
version: "0.1.0"
slug: phoedox
description: Documentation with a knowledge graph for your home – rooms, devices, network, manuals and an emergency folder.
url: https://phoedox.com
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
backup: hot
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Web interface
webui: "http://[HOST]:[PORT:8080]"
options:
  ha_url: ""
  public_url: ""
  sign_in_with_home_assistant: true
schema:
  ha_url: url?
  public_url: url?
  sign_in_with_home_assistant: bool
